<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioBraille</title>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <header class="app-header">
    <a class="brand" href="#" data-action="home" aria-label="AudioBraille 首页">
      <span class="brand-mark" aria-hidden="true">⠁⠃</span>
      <span class="brand-name">AudioBraille</span>
    </a>
    <nav aria-label="主导航" class="main-nav">
      <button data-action="home" aria-current="true">首页</button>
      <button data-action="learning" aria-current="false">学习盲文</button>
      <button data-action="experiment" aria-current="false">AudioBraille 实验</button>
      <button data-action="reader" aria-current="false">体验盲文听书</button>
      <button data-action="notes" aria-current="false">笔记</button>
    </nav>
    <button id="lang-toggle" class="lang-btn" type="button" data-action="toggle-language" aria-label="切换语言">中文 / EN</button>
  </header>
  <main id="main-content" tabindex="-1"></main>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="start-gate" role="dialog" aria-modal="true" aria-label="开始使用">
    <div class="gate-card">
      <div class="gate-mark" aria-hidden="true">⠁⠃</div>
      <h1>AudioBraille</h1>
      <p>学习盲文，体验一种用空间音频聆听盲文的新方法。</p>
      <p class="gate-hint">请按 0 开始</p>
      <p class="gate-guide">小键盘 7、4、1 对应点 1、2、3；8、5、2 对应点 4、5、6。按 0 提交，按 * 确认下一方。</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
