<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AudioBraille 盲文学习平台</title>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">⠁⠃</span>
      <span class="brand-name">AudioBraille</span>
    </div>
    <nav aria-label="主导航" class="main-nav">
      <button data-page="teaching" aria-current="true">教学</button>
      <button data-page="input">盲文输入器</button>
      <button data-page="experiment">听觉实验</button>
      <button data-page="notes">笔记记录器</button>
    </nav>
    <div class="header-actions">
      <button id="lang-toggle" class="lang-btn" title="切换语言 Ctrl+Shift+L" aria-label="切换语言">
        <span class="lang-zh">中文</span><span class="lang-sep">/</span><span class="lang-en">EN</span>
      </button>
    </div>
  </header>
  <main id="main-content" tabindex="-1" aria-live="polite"></main>
  <div id="status" role="status" aria-live="polite"></div>
  <!-- 启动门：全屏遮罩，按 0 前挡住一切 -->
  <div id="start-gate" role="dialog" aria-label="start">
    <div class="gate-card">
      <div class="gate-mark" aria-hidden="true">⠁⠃</div>
      <div class="gate-title">AudioBraille</div>
      <div class="gate-hint" id="gate-hint">请按 0 开始</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
